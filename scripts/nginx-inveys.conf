# ==============================================================================
# Alternatif: Konfigurasi Nginx untuk INVEYS (Host VPS / Non-Docker Caddy)
# Tempatkan berkas ini di: /etc/nginx/sites-available/inveys.conf
# Lalu aktifkan: ln -s /etc/nginx/sites-available/inveys.conf /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Blok Akses Langsung IP HTTPS Port 3000 (https://187.77.134.249:3000)
server {
    listen 3000 ssl;
    server_name 187.77.134.249;

    # SSL Certificate (Gunakan self-signed cert untuk IP atau sertifikat server)
    ssl_certificate /etc/ssl/certs/inveys-ip.crt;
    ssl_certificate_key /etc/ssl/private/inveys-ip.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3001; # atau port backend INVEYS
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# 2. Redirect HTTP ke HTTPS untuk domain inveys.io
server {
    listen 80;
    server_name inveys.io www.inveys.io;
    return 301 https://inveys.io$request_uri;
}

# 3. Blok Domain Resmi HTTPS (https://inveys.io)
server {
    listen 443 ssl http2;
    server_name inveys.io www.inveys.io;

    # SSL Certificate Let's Encrypt (Dibuat otomatis via certbot --nginx)
    ssl_certificate /etc/letsencrypt/live/inveys.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inveys.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
