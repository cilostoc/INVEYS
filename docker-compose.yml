services:
  inveys:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/cilostoc/inveys:latest
    container_name: inveys-app
    restart: unless-stopped
    ports:
      - "${INVEYS_PORT:-3000}:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - INVEYS_DATA_DIR=/data
      - DOMAIN=${DOMAIN:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - MUSE_MODEL=${MUSE_MODEL:-}
      - NINEROUTER_API_KEY=${NINEROUTER_API_KEY:-}
      - NINEROUTER_MODEL=${NINEROUTER_MODEL:-}
      - NINEROUTER_BASE_URL=${NINEROUTER_BASE_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - inveys_data:/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/auth/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: inveys-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=120
      - WATCHTOWER_LABEL_ENABLE=true

volumes:
  inveys_data:
    name: inveys_vault_data
