services:
  inveys:
    build:
      context: .
      dockerfile: Dockerfile
    image: inveys:latest
    container_name: inveys-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - INVEYS_DATA_DIR=/data
      - DOMAIN=${DOMAIN:-inveys.io}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-inveys.io,www.inveys.io,187.77.134.249,127.0.0.1,localhost}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - MUSE_MODEL=${MUSE_MODEL:-}
      - NINEROUTER_API_KEY=${NINEROUTER_API_KEY:-}
      - NINEROUTER_MODEL=${NINEROUTER_MODEL:-}
      - NINEROUTER_BASE_URL=${NINEROUTER_BASE_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - inveys_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/auth/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: inveys-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"
    environment:
      - DOMAIN=${DOMAIN:-inveys.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      inveys:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  inveys_data:
    name: inveys_vault_data
  caddy_data:
    name: inveys_caddy_data
  caddy_config:
    name: inveys_caddy_config
